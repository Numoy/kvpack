[project]
name = "kvpack"
version = "0.2.0"
description = "Pack your documents into a trained KV cache: long-context answers without RAG, at a fraction of the memory."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Numoy" }]
requires-python = ">=3.11"
keywords = ["llm", "kv-cache", "rag", "long-context", "cartridges", "context-distillation", "transformers"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "pydantic>=2.6",
    "rich>=13.0",
    "safetensors>=0.4",
    "torch>=2.4",
    "transformers>=5.0",
    "typer>=0.12",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]

[project.scripts]
kvpack = "kvpack.cli:main"

[project.urls]
Homepage = "https://github.com/Numoy/kvpack"
Paper = "https://arxiv.org/abs/2506.06266"

[dependency-groups]
dev = [
    "openai>=3.19.2",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
